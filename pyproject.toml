[project]
name = "library-cli"
version = "0.1.0"
description = "Containerized CLI Library Management System"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
library = "app.main:cli"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
