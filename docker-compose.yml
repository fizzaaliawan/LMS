services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - library-net
    # Not exposed to the host by default - keeps the DB reachable only inside
    # the compose network. Uncomment for local debugging with a DB client.
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - library-net
    # CLI: run one-off commands, e.g.
    #   docker compose run --rm app add-book --title "Dune" --author "Herbert" --isbn 123
    entrypoint: ["library"]
    command: ["--help"]

volumes:
  pgdata:
  redisdata:

networks:
  library-net:
    driver: bridge
